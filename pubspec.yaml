name: budget_bites
description: "SmartBites - healthy, budget-friendly meal planner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/meals/
    - assets/images/ingredients/
    - assets/images/pantries/
    - assets/images/onboardings/
    - assets/images/logos/
    - assets/icons/
    - assets/fonts/playfair/OFL.txt
  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/playfair/Playfair-Variable.ttf
        - asset: assets/fonts/playfair/Playfair-Italic-Variable.ttf
          style: italic
